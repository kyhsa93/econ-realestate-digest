name: Digest summarize

# AI 요약·번역만 따로 돌린다.
#
# 이 두 작업은 러너에 Ollama를 깔고 9GB짜리 모델을 받아 CPU로 돌리는 일이라 한 번에
# 40분~1시간이 걸린다. 수집(뉴스·시장지표·실거래가)은 하루 네 번 돌아야 하지만 요약까지
# 네 번 다시 쓸 이유는 없어서, 수집 파이프라인에서 떼어내고 필요할 때만 모델을 받는다.
#
# "필요할 때"는 scripts/summary-needed.mjs가 판정한다 - 오늘 요약이 아직 없거나, 요약
# 이후 기사가 충분히 새로 들어왔거나, 번역이 밀렸을 때. 판정을 별도 job으로 둔 덕에
# 필요 없는 날은 1분짜리 job 하나로 끝나고 모델은 받지도 않는다.

on:
  # 수집이 끝난 뒤에 이어서 본다. 새 기사가 들어온 직후가 다시 요약할지 판단하기
  # 가장 좋은 시점이다.
  workflow_run:
    workflows: ["Digest update"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "판정을 무시하고 무조건 요약"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# 수집 워크플로도 같은 그룹을 쓴다. 둘 다 docs를 커밋하므로 겹쳐 돌면 push가 서로 밀린다.
concurrency:
  group: digest-pipeline
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # 수집이 실패한 실행을 이어받아 봐야 재료가 없다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # workflow_run은 트리거한 실행의 커밋을 기본으로 잡는다. 수집이 방금 밀어넣은
      # 커밋을 받아야 하므로 브랜치 최신을 명시한다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - id: decide
        run: node scripts/summary-needed.mjs

  summarize:
    needs: check
    if: needs.check.outputs.needed == 'true' || inputs.force
    runs-on: ubuntu-latest
    env:
      OLLAMA_MODEL: qwen3:14b
      OLLAMA_THINK: "false"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - run: npm ci

      - name: 왜 돌리는지 남긴다
        run: echo "${{ needs.check.outputs.reason || '수동 실행(force)' }}"

      - name: Ollama 설치 및 모델 준비
        env:
          OLLAMA_VERSION: v0.32.6
          OLLAMA_SHA256: dec2fa50d24e6868ca3c4c977d69d059399372105f951a9acc320a5a79aadcfc
        run: |
          command -v zstd >/dev/null || (sudo apt-get update -y && sudo apt-get install -y zstd)
          curl -fsSL -o ollama.tar.zst \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_SHA256}  ollama.tar.zst" | sha256sum -c -
          zstd -d ollama.tar.zst -o ollama.tar
          sudo tar -xf ollama.tar -C /usr/local
          rm -f ollama.tar.zst ollama.tar

          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/version > /dev/null && break
            sleep 1
          done
          ollama pull "$OLLAMA_MODEL"

      - name: AI 요약 생성
        run: node scripts/summarize-digest.mjs

      - name: 뉴스 제목 영어 번역
        run: node scripts/translate-news.mjs

      # 요약·번역이 summary.json과 news.json을 바꿨으니 정적 HTML을 다시 심는다.
      # 칩 붙이기까지 다시 도는 이유는 번역된 제목이 기사 줄에 들어가기 때문이다.
      - name: 정적 HTML에 오늘 내용 심기
        run: |
          node scripts/news-context.mjs
          node scripts/prerender.mjs
          node scripts/build-news-pages.mjs
          node scripts/build-budget-pages.mjs
          node scripts/build-realestate-pages.mjs

      - name: 테스트
        run: npm test

      - name: 변경사항 커밋 및 푸시
        run: ./scripts/push-docs.sh "chore: AI 요약 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"

      - name: Pages 배포
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: "./docs"

      - name: Pages에 배포
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
