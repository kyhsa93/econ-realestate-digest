name: Digest update

# 뉴스는 하루 4번, 시장지표/부동산/AI 요약은 아침 1번만 갱신한다. 뉴스까지 하루
# 1회로 두면 저녁 방문자는 12시간 묵은 목록을 보게 되고, 반대로 부동산 실거래가
# API는 일일 호출 한도가 있어 하루 여러 번 호출할 수 없다.
# (정각은 GitHub Actions 스케줄 트리거가 몰려 지연이 커서 7분씩 밀어둠)
on:
  schedule:
    - cron: "7 23 * * *" # 08:07 KST - 전체 갱신
    - cron: "7 3 * * *" # 12:07 KST - 뉴스만
    - cron: "7 7 * * *" # 16:07 KST - 뉴스만
    - cron: "7 11 * * *" # 20:07 KST - 뉴스만
  workflow_dispatch:
    inputs:
      mode:
        description: "갱신 범위 (full=전체, news=뉴스만)"
        type: choice
        options: [full, news]
        default: full

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # 수동 실행은 입력값을 그대로 쓰고, 스케줄 실행은 아침 크론만 full로 본다.
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '7 23 * * *' && 'full' || 'news') }}
      # 요약/번역 모두 같은 모델을 쓴다. 러너가 4코어 CPU(GPU 없음)/16GB RAM이라
      # RAM에 들어가는 상한이 14b급(Q4 약 9GB)이고, 실제로 같은 뉴스로 비교 실행해
      # 고른 값이다. qwen3는 thinking이 기본이라 반드시 꺼야 한다(안 끄면 응답에
      # <think> 블록이 붙어 요약/번역이 통째로 폐기됨).
      OLLAMA_MODEL: qwen3:14b
      OLLAMA_THINK: "false"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - run: npm ci

      - name: 뉴스 수집
        run: node scripts/fetch-news.mjs

      - name: 시장 지표·부동산 수집
        if: env.MODE == 'full'
        run: |
          node scripts/fetch-market.mjs
          node scripts/fetch-realestate.mjs
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MOLIT_API_ENDPOINT: ${{ secrets.MOLIT_API_ENDPOINT }}
          MOLIT_RENT_API_KEY: ${{ secrets.MOLIT_RENT_API_KEY }}
          MOLIT_RENT_API_ENDPOINT: ${{ secrets.MOLIT_RENT_API_ENDPOINT }}

      # 뉴스만 갱신하는 실행에서도 새로 들어온 제목을 영어로 번역해야 해서
      # 모델은 매번 준비한다(설치 + 9GB pull이 1분 남짓).
      - name: Ollama 설치 및 모델 준비
        env:
          OLLAMA_VERSION: v0.32.6
          OLLAMA_SHA256: dec2fa50d24e6868ca3c4c977d69d059399372105f951a9acc320a5a79aadcfc
        run: |
          # 공식 install.sh를 curl | sh로 그대로 실행하는 대신, 버전을 고정하고
          # GitHub 릴리스가 게시한 sha256sum.txt와 대조해 무결성을 검증한다.
          command -v zstd >/dev/null || (sudo apt-get update -y && sudo apt-get install -y zstd)
          curl -fsSL -o ollama.tar.zst \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_SHA256}  ollama.tar.zst" | sha256sum -c -
          zstd -d ollama.tar.zst -o ollama.tar
          sudo tar -xf ollama.tar -C /usr/local
          rm -f ollama.tar.zst ollama.tar

          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/version > /dev/null && break
            sleep 1
          done
          ollama pull "$OLLAMA_MODEL"

      # 요약도 뉴스와 함께 하루 4번 다시 만든다. 아침 1회만 만들던 때는 저녁
      # 방문자에게 "오늘의 AI 요약"이 아침 뉴스 기준이라 아래 뉴스 목록과 내용이
      # 어긋났다. (실행당 4분쯤 더 걸리지만 배치라 문제되지 않음)
      - name: AI 요약 생성
        run: node scripts/summarize-digest.mjs

      - name: 뉴스 제목 영어 번역
        run: node scripts/translate-news.mjs

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/data; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git add docs/data
          if [ "$MODE" = "full" ]; then
            git commit -m "chore: 데일리 데이터 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          else
            git commit -m "chore: 뉴스 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          fi
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 실패($i), rebase 후 재시도"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
            sleep $((i * 3))
          done
          echo "push 재시도 모두 실패"
          exit 1

      - name: Pages 배포
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: "./docs"

      - name: Pages에 배포
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
