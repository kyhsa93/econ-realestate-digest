name: Daily digest update

on:
  schedule:
    - cron: "0 23 * * *" # 매일 08:00 KST
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - run: npm ci

      - name: 뉴스/시장 지표 수집
        run: |
          node scripts/fetch-news.mjs
          node scripts/fetch-market.mjs
          node scripts/fetch-realestate.mjs
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MOLIT_API_ENDPOINT: ${{ secrets.MOLIT_API_ENDPOINT }}
          MOLIT_RENT_API_KEY: ${{ secrets.MOLIT_RENT_API_KEY }}
          MOLIT_RENT_API_ENDPOINT: ${{ secrets.MOLIT_RENT_API_ENDPOINT }}

      - name: Ollama 설치 및 모델 준비
        env:
          OLLAMA_VERSION: v0.32.6
          OLLAMA_SHA256: dec2fa50d24e6868ca3c4c977d69d059399372105f951a9acc320a5a79aadcfc
        run: |
          # 공식 install.sh를 curl | sh로 그대로 실행하는 대신, 버전을 고정하고
          # GitHub 릴리스가 게시한 sha256sum.txt와 대조해 무결성을 검증한다.
          command -v zstd >/dev/null || (sudo apt-get update -y && sudo apt-get install -y zstd)
          curl -fsSL -o ollama.tar.zst \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_SHA256}  ollama.tar.zst" | sha256sum -c -
          zstd -d ollama.tar.zst -o ollama.tar
          sudo tar -xf ollama.tar -C /usr/local
          rm -f ollama.tar.zst ollama.tar

          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/version > /dev/null && break
            sleep 1
          done
          ollama pull qwen2.5:3b

      - name: AI 요약 생성
        run: node scripts/summarize-digest.mjs

      - name: 뉴스 제목 영어 번역
        run: node scripts/translate-news.mjs

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/data; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git add docs/data
          git commit -m "chore: 데일리 데이터 갱신 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 실패($i), rebase 후 재시도"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
            sleep $((i * 3))
          done
          echo "push 재시도 모두 실패"
          exit 1

      - name: Pages 배포
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: "./docs"

      - name: Pages에 배포
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
