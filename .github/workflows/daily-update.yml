name: Digest update

on:
  schedule:
    - cron: "7 23 * * *"
    - cron: "7 3 * * *"
    - cron: "7 7 * * *"
    - cron: "7 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "갱신 범위 (full=전체, news=뉴스만)"
        type: choice
        options: [full, news]
        default: full
      backfill:
        description: "실거래 원본 백필 상한 (비우면 50)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '7 23 * * *' && 'full' || 'news') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - run: npm ci

      - name: 테스트 (수집 전)
        run: npm test

      - name: 뉴스 수집
        run: node scripts/fetch-news.mjs

      - name: 시장 지표 수집
        if: env.MODE == 'full'
        run: node scripts/fetch-market.mjs
        env:
          # 없으면 공개 sample 키로 돈다. 시크릿을 넣으면 열 건 제한이 풀린다.
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}

      - name: 실거래 수집
        if: env.MODE == 'full'
        run: |
          node scripts/fetch-realestate.mjs
          node scripts/build-realestate.mjs
          node scripts/build-budget-deals.mjs
          node scripts/build-conversion.mjs
          node scripts/build-cancellation.mjs
          node scripts/build-renewal-facts.mjs
          node scripts/build-floor-gap.mjs
          node scripts/build-complex-ratio.mjs
          node scripts/build-rent-preview.mjs
          node scripts/build-search-index.mjs
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MOLIT_API_ENDPOINT: ${{ secrets.MOLIT_API_ENDPOINT }}
          MOLIT_RENT_API_KEY: ${{ secrets.MOLIT_RENT_API_KEY }}
          MOLIT_RENT_API_ENDPOINT: ${{ secrets.MOLIT_RENT_API_ENDPOINT }}
          MOLIT_BACKFILL_LIMIT: ${{ inputs.backfill }}

      - name: 예·적금·대출 금리 수집
        if: env.MODE == 'full'
        run: node scripts/fetch-rates.mjs
        env:
          FSS_FINLIFE_API_KEY: ${{ secrets.FSS_FINLIFE_API_KEY }}

      - name: 기사에 실거래가·금리 수치 붙이기
        run: node scripts/news-context.mjs

      - name: 정적 HTML에 오늘 내용 심기
        run: |
          node scripts/prerender.mjs
          node scripts/build-rate-pages.mjs
          node scripts/build-news-pages.mjs
          node scripts/build-budget-pages.mjs
          node scripts/build-realestate-pages.mjs

      # 커밋이 테스트보다 먼저다.
      #
      # 수집 후 테스트가 깨지면 그날 받은 데이터가 통째로 사라진다 — 국토부·금감원에서
      # 하루치를 다시 받을 방법이 없고, 실제로 수집이 사흘 연속 유실된 적이 있다.
      # 커밋을 먼저 하면 자료는 남고, 아래 테스트가 실패하면 배포는 멈춘 채로 빨갛게
      # 뜬다. 잃는 것(그날 배포가 밀림)이 잃지 않는 것(그날 자료)보다 싸다.
      - name: 변경사항 커밋 및 푸시
        run: |
          if [ "$MODE" = "full" ]; then
            ./scripts/push-docs.sh "chore: 데일리 데이터 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          else
            ./scripts/push-docs.sh "chore: 뉴스 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          fi

      - name: 테스트 (수집 후)
        run: npm test

      - name: Pages 배포
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: "./docs"

      - name: Pages에 배포
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
