<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#253e81">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>뉴스 아카이브</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666;
    --card: #f5f5f7;
    --border: #e2e2e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #eaeaea;
      --muted: #9a9a9a;
      --card: #1a1d24;
      --border: #2a2d35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.5;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .back-link {
    color: var(--muted);
    font-size: 0.85rem;
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }
  .lang-toggle {
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    color: var(--fg);
  }
  .date-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
    padding: 12px;
    margin-bottom: 28px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .date-chip {
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--fg);
    text-decoration: none;
    white-space: nowrap;
  }
  .date-chip:hover { text-decoration: underline; }
  .date-chip.active {
    font-weight: 700;
    border-color: var(--fg);
  }
  section {
    margin-bottom: 32px;
  }
  h2 {
    font-size: 1.05rem;
    margin: 0 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  ul.news-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .news-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .news-item:last-child { border-bottom: none; }
  .news-item a {
    color: var(--fg);
    text-decoration: none;
    font-size: 0.95rem;
  }
  .news-item a:hover { text-decoration: underline; }
  .news-meta {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 2px;
  }
  .error {
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="page-title">날짜별 뉴스 아카이브</h1>
      <a class="back-link" id="back-link" href="./index.html">← 홈으로</a>
    </div>
    <button class="lang-toggle" type="button" id="lang-toggle" aria-label="Switch language">
      <span aria-hidden="true">🌐</span>
    </button>
  </header>

  <nav class="date-nav" id="date-nav">
    <div class="error">불러오는 중...</div>
  </nav>

  <section id="day-section">
    <h2 id="day-heading">-</h2>
    <ul class="news-list" id="day-news-list">
      <li class="error">불러오는 중...</li>
    </ul>
  </section>
</main>

<script>
  const T = {
    ko: {
      title: "날짜별 뉴스 아카이브",
      backLink: "← 홈으로",
      errorLoad: "데이터를 불러오지 못했습니다.",
      empty: "아직 뉴스 기록이 없습니다.",
      notFound: "해당 날짜의 뉴스 기록을 찾을 수 없습니다.",
      dayHeading: (d) => `${d} 뉴스`,
    },
    en: {
      title: "News Archive by Date",
      backLink: "← Home",
      errorLoad: "Failed to load data.",
      empty: "No news records yet.",
      notFound: "No news found for this date.",
      dayHeading: (d) => `News — ${d}`,
    },
  };

  let locale = "en";
  function t(key) {
    return T[locale][key];
  }

  function getInitialLocale() {
    const saved = window.localStorage.getItem("lang");
    return saved === "en" || saved === "ko" ? saved : "en";
  }

  // 뉴스 제목은 AI가 별도로 영어 번역(titleEn)을 만들어두면 그걸 쓰고,
  // 없으면(번역 실패/아직 처리 전) 원문 한국어로 대체한다. (index.html과 동일한 규칙)
  function pickTitle(item) {
    return locale === "en" ? item.titleEn ?? item.title : item.title;
  }

  async function loadJson(name) {
    const res = await fetch(`./data/${name}.json?_=${Date.now()}`);
    if (!res.ok) throw new Error(`${name} load failed`);
    return res.json();
  }

  function fmtTime(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleString(locale === "ko" ? "ko-KR" : "en-US", {
      timeZone: "Asia/Seoul",
      dateStyle: "short",
      timeStyle: "short",
    });
  }

  let history = [];

  function renderDateNav(selectedDate) {
    const nav = document.getElementById("date-nav");
    if (!history.length) {
      nav.innerHTML = `<div class="error">${t("empty")}</div>`;
      return;
    }
    nav.innerHTML = history
      .map((h) => `<a class="date-chip${h.date === selectedDate ? " active" : ""}" href="./news.html?date=${h.date}">${h.date}</a>`)
      .join("");
  }

  function renderDay(date) {
    const heading = document.getElementById("day-heading");
    const list = document.getElementById("day-news-list");
    const entry = history.find((h) => h.date === date);

    heading.textContent = date ? t("dayHeading")(date) : "";

    if (!entry?.items?.length) {
      list.innerHTML = `<li class="error">${date ? t("notFound") : t("empty")}</li>`;
      return;
    }

    list.innerHTML = entry.items
      .map(
        (item) => `
          <li class="news-item">
            <a href="${item.link}" target="_blank" rel="noopener">${pickTitle(item)}</a>
            <div class="news-meta">${item.source ?? ""} · ${fmtTime(item.publishedAt)}</div>
          </li>`
      )
      .join("");
  }

  function currentDate() {
    const fromQuery = new URLSearchParams(location.search).get("date");
    if (fromQuery) return fromQuery;
    return history[0]?.date ?? "";
  }

  function applyLocale(next) {
    locale = next;
    window.localStorage.setItem("lang", locale);
    document.documentElement.setAttribute("lang", locale);
    document.title = t("title");
    document.getElementById("page-title").textContent = t("title");
    document.getElementById("back-link").textContent = t("backLink");

    const date = currentDate();
    renderDateNav(date);
    renderDay(date);
  }

  document.getElementById("lang-toggle").addEventListener("click", () => {
    applyLocale(locale === "en" ? "ko" : "en");
  });

  async function main() {
    locale = getInitialLocale();
    try {
      const raw = await loadJson("news-history");
      history = (Array.isArray(raw) ? raw : []).slice().sort((a, b) => b.date.localeCompare(a.date));
    } catch (err) {
      console.error("[news] 히스토리 로드 실패:", err.message);
      history = [];
    }
    applyLocale(locale);
  }

  main();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
