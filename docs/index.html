    --muted: #9a9a9a;

    color: var(--fg);

  }
  .summary-category {
    margin-bottom: 14px;
  }
  .summary-category:last-child {

  .summary-category-label {

    font-size: 0.85rem;
    margin-bottom: 2px;
  }
  .summary-category-line {

  }
  .summary-links {
    list-style: none;
    margin: 6px 0 0;
    padding: 0;
  }
  .summary-links li {
    font-size: 0.82rem;
    margin-top: 4px;
  }
  .summary-links a {

  }
  .summary-links a:hover {

  }
  .summary-link-source {
    color: var(--muted);
  }
  .summary-plain-label {

  }
  .summary-meta {
    display: block;

    font-size: 0.75rem;
    margin-top: 10px;
  }
  .error {
    color: var(--muted);

  .history-grid {

  .history-more {

  .history-more summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.82rem;
    padding: 6px 0;

  .history-more summary::-webkit-details-marker {

  .history-more summary::before {

  .history-card {

  .archive-date-jump {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 16px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .archive-date-jump input,
  .archive-date-jump button {
    background: var(--card);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.85rem;
  }
  .archive-date-jump button {
    cursor: pointer;
  }
  .site-footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);

  .site-footer a {
    color: var(--muted);
    font-size: 0.8rem;
    text-decoration: none;
  }
  .site-footer a:hover { text-decoration: underline; }
</style>

  <footer class="site-footer">

  let locale = "en";
  function t(key) {
    return T[locale][key];
  }

  function getInitialLocale() {
    const saved = window.localStorage.getItem("lang");
    // 대상 독자가 한국어권이라 static meta(description/OG/JSON-LD 등)도
    // 전부 한국어로 작성돼 있음 - 기본값을 en으로 두면 첫 방문자에게
    // 하이드레이션 후 렌더링되는 title/meta가 영어로 덮어써져 static
    // 태그와 어긋나므로(=검색엔진이 실제로 색인하는 언어가 영어가 됨)
    // ko를 기본값으로 함.
    return saved === "en" || saved === "ko" ? saved : "ko";
  }

  // ---- 테마(라이트/다크/자동) --------------------------------------------
  // "자동"(기본값)은 OS의 prefers-color-scheme을 그대로 따르고, data-theme
  // 속성이 붙으면(사용자가 직접 고르면) CSS 쪽 [data-theme=...] 규칙이
  // 미디어쿼리보다 우선해서 덮어쓴다.
  const THEME_ICONS = { auto: "🌓", light: "☀️", dark: "🌙" };
  let theme = "auto";

  function getInitialTheme() {
    const saved = window.localStorage.getItem("theme");
    return saved === "light" || saved === "dark" ? saved : "auto";
  }

  function applyTheme(next) {
    theme = next;
    window.localStorage.setItem("theme", theme);
    if (theme === "auto") {
      document.documentElement.removeAttribute("data-theme");
    } else {
      document.documentElement.setAttribute("data-theme", theme);
    }
    const icon = document.querySelector("#theme-toggle span");
    if (icon) icon.textContent = THEME_ICONS[theme];
  }

  // main()의 데이터 로딩(fetch)을 기다리지 않고 즉시 적용해 테마 깜빡임을 피한다.
  applyTheme(getInitialTheme());

  // ---- data cache (재조회 없이 언어 전환 시 재렌더링하기 위함) ----------
  const cache = {
    market: null,
    news: null,
    summary: null,
    history: null,
    summaryHistory: null,
    newsHistory: null,
    realestate: null,
    realestateHistory: null,
  };

  // 뉴스/시장지표/부동산/요약을 각각 별도 "아카이브 페이지"로 만드는 대신,
  // 메인 페이지 자체가 ?date=YYYY-MM-DD 쿼리를 받으면 그 날짜의 히스토리
  // 데이터로 똑같은 섹션 구성을 그대로 렌더링한다 (실시간 환율만 예외).
  const viewDate = new URLSearchParams(location.search).get("date");
  const isArchiveView = !!viewDate;

  function kstToday() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());
  }

  function findByDate(history, date) {
    return (Array.isArray(history) ? history : []).find((h) => h.date === date) ?? null;
  }

  // 원/달러 환율은 브라우저에서 직접 exchangerate.fun(무료, 키 불필요,
  // CORS 개방, 대략 1시간 이내로 갱신)을 호출해서 일자별 배치 값보다 훨씬
  // 신선한 값을 보여준다. 코스피는 쓰던 소스가 다른 도메인의 요청을
  // 403으로 막아서(자체 CORS 없음) 브라우저에서 직접 못 가져오고, 기존
  // 배치 값(하루 1회)을 그대로 쓴다. 실패해도 배치 값으로 조용히 폴백.
  let liveUsdKrw = null;

  async function fetchLiveUsdKrw() {
    try {
      const res = await fetch("https://api.exchangerate.fun/latest?base=USD");
      if (!res.ok) throw new Error(`http ${res.status}`);
      const data = await res.json();
      const value = Number(data?.rates?.KRW);
      if (!Number.isFinite(value)) throw new Error("KRW 필드 없음");
      liveUsdKrw = { value, timestamp: data.timestamp };
      renderMarket(cache.market);
    } catch (err) {
      console.error("[market] 실시간 환율 조회 실패, 배치 값 유지:", err.message);
    }
  }

  function fmtUpdated(iso) {
    if (!iso) return "-";
    const d = new Date(iso);
    return d.toLocaleString(locale === "ko" ? "ko-KR" : "en-US", {
      timeZone: "Asia/Seoul",
      dateStyle: "medium",
      timeStyle: "short",
    }) + " KST";
  }

  async function loadJson(name) {
    const res = await fetch(`./data/${name}.json?_=${Date.now()}`);
    if (!res.ok) throw new Error(`${name} load failed`);
    return res.json();
  }

  function directionClass(direction) {
    if (direction === "RISING") return "up";
    if (direction === "FALLING") return "down";
    return "";
  }

  function renderMarket(market) {
    const tbody = document.getElementById("market-grid");
    if (!market) {
      tbody.innerHTML = `<tr><td colspan="3" class="error">${t("marketError")}</td></tr>`;
      return;
    }
    const rows = [];
    if (market.kospi) {
      rows.push(`
        <tr>
          <td>${t("kospiLabel")}</td>
          <td>${market.kospi.value}</td>
          <td class="change ${directionClass(market.kospi.direction)}">${market.kospi.change ?? ""}</td>
        </tr>`);
    }
    if (market.usdKrw || liveUsdKrw) {
      const displayValue = liveUsdKrw ? liveUsdKrw.value : Number(market.usdKrw.value);
      const liveBadge = liveUsdKrw
        ? ` <span class="live-badge" title="${t("liveFxTitle")(fmtUpdated(new Date(liveUsdKrw.timestamp * 1000).toISOString()))}">${t("liveFxBadge")}</span>`
        : "";
      rows.push(`
        <tr>
          <td>${t("usdKrwLabel")}</td>
          <td>${displayValue.toFixed(2)}${liveBadge}</td>
          <td></td>
        </tr>`);
    }
    if (market.baseRate) {
      rows.push(`
        <tr>
          <td>${t("baseRateLabel")}</td>
          <td>${market.baseRate.value}%</td>
          <td class="change">${t("baseRateSince")(market.baseRate.effectiveFrom)}</td>
        </tr>`);
    }
    tbody.innerHTML = rows.join("") || `<tr><td colspan="3" class="error">${t("marketEmpty")}</td></tr>`;
  }

  function sparklineSvg(values) {
    const w = 280, h = 56, pad = 4;
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    const step = values.length > 1 ? (w - pad * 2) / (values.length - 1) : 0;
    const points = values
      .map((v, i) => {
        const x = pad + i * step;
        const y = h - pad - ((v - min) / range) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      })
      .join(" ");
    const last = values[values.length - 1];
    const lastX = pad + (values.length - 1) * step;
    const lastY = h - pad - ((last - min) / range) * (h - pad * 2);
    const rising = values.length > 1 && last >= values[0];
    const color = rising ? "var(--up)" : "var(--down)";
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" />
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2.5" fill="${color}" />
    </svg>`;
  }

  function parseNumeric(v) {
    if (typeof v === "number") return v;
    if (typeof v === "string") return parseFloat(v.replace(/,/g, ""));
    return NaN;
  }

  // renderHistory/renderRealestateHistory가 공통으로 쓰는 카드 마크업.
  // 스파크라인은 상대적인 등락 "모양"만 보여줘서 지금 값이 최근 30일 중
  // 어느 위치인지 감이 안 온다는 피드백을 반영해, 현재값과 최고/최저를
  // 텍스트로 같이 보여준다.
  function historyCardHtml({ label, values, format, firstDate, lastDate }) {
    const current = values[values.length - 1];
    const min = Math.min(...values);
    const max = Math.max(...values);
    return `
      <div class="history-card">
        <div class="label">${label}</div>
        <div class="history-stats">
          <span class="history-current">${format(current)}</span>
          <span class="history-minmax">${t("historyMinMax")(format(max), format(min))}</span>
        </div>
        ${sparklineSvg(values)}
        <div class="range"><span>${firstDate ?? ""}</span><span>${lastDate ?? ""}</span></div>
      </div>`;
  }

  function renderHistory(history) {
    const grid = document.getElementById("history-grid");
    if (!Array.isArray(history) || history.length < 2) {
      grid.innerHTML = "";
      return;
    }
    const recent = history.slice(-30);
    const series = [
      {
        label: t("historyKospiLabel"),
        get: (h) => parseNumeric(h.kospi?.value),
        format: (v) => v.toLocaleString(locale === "ko" ? "ko-KR" : "en-US", { maximumFractionDigits: 2 }),
      },
      {
        label: t("historyUsdKrwLabel"),
        get: (h) => parseNumeric(h.usdKrw?.value),
        format: (v) => v.toFixed(2),
      },
      {
        // 기준금리는 금통위 회의(대략 1~2개월 간격) 때만 바뀌어서 대부분
        // 평평한 선으로 보이지만, 실제로 바뀌는 시점을 한눈에 보여주는
        // 용도로는 여전히 유효하다.
        label: t("historyBaseRateLabel"),
        get: (h) => parseNumeric(h.baseRate?.value),
        format: (v) => `${v.toFixed(2)}%`,
      },
    ];

    grid.innerHTML = series
      .map(({ label, get, format }) => {
        const values = recent.map(get).filter((v) => !Number.isNaN(v));
        if (values.length < 2) return "";
        const first = recent.find((h) => !Number.isNaN(get(h)));
        const last = recent.slice().reverse().find((h) => !Number.isNaN(get(h)));
        return historyCardHtml({ label, values, format, firstDate: first?.date, lastDate: last?.date });
      })
      .join("");
  }

  function formatPyeongPrice(value10k) {
    if (locale === "ko") return `${value10k.toLocaleString("ko-KR")}만원`;
    return `₩${(value10k / 100).toLocaleString("en-US", { maximumFractionDigits: 1 })}M`;
  }

  function realestateChangeHtml(change) {
    if (!change) return "";
    const { value10k, percent } = change;
    const dir = value10k > 0 ? "up" : value10k < 0 ? "down" : "";
    const arrow = value10k > 0 ? "▲" : value10k < 0 ? "▼" : "";
    const percentText = percent != null ? `${percent >= 0 ? "+" : ""}${percent.toFixed(1)}%` : "";
    return `<span class="change ${dir}">${arrow}${percentText}</span>`;
  }

  // 전월세 기능 추가 전에는 sale/jeonse/wolse로 감싸지 않고 매매 값을
  // overall/district 객체에 바로 두는 평평한 포맷이었다. 그 시절 마지막으로
  // 성공한 데이터가 배포된 상태에서 이 화면 코드만 먼저 갱신되면(예: API 호출
  // 한도로 새 포맷 데이터가 아직 안 만들어진 경우) 행이 통째로 비어 보이므로,
  // 옛 포맷도 sale로 감싸서 인식하게 한다.
  function normalizeRealestateEntry(entry) {
    if (!entry) return entry;
    if (entry.sale || entry.jeonse || entry.wolse) return entry; // 이미 새 포맷
    if (typeof entry.avgPricePerPyeong10k !== "number") return entry;
    return {
      ...entry,
      sale: {
        avgPricePerM2: entry.avgPricePerM2,
        avgPricePerPyeong10k: entry.avgPricePerPyeong10k,
        transactionCount: entry.transactionCount,
        change: entry.change,
        baselineDate: entry.baselineDate,
      },
    };
  }

  function realestateCountHtml(metric) {
    if (!metric || metric.transactionCount == null) return "";
    return `<span class="tx-count">${t("realestateCountSuffix")(metric.transactionCount)}</span>`;
  }

  function realestateDateHintAttr(metric) {
    if (!metric?.change || !metric.baselineDate) return "";
    return ` title="${t("realestateChangeVs")(metric.baselineDate)}"`;
  }

  // 매매/전세는 값 하나에 증감(change)을 바로 붙이고, 월세는 보증금/월세를
  // 각각 따로 증감(depositChange/monthlyRentChange)으로 표시한다. 거래건수는
  // 자치구·서울 전체(overall) 행 모두 같은 셀 렌더러를 쓰므로 자동으로 같이 보임.
  function realestateSaleCellHtml(sale) {
    if (!sale) return "-";
    return `<span${realestateDateHintAttr(sale)}>${formatPyeongPrice(sale.avgPricePerPyeong10k)}</span> ${realestateChangeHtml(sale.change)} ${realestateCountHtml(sale)}`;
  }

  function realestateJeonseCellHtml(jeonse) {
    if (!jeonse) return "-";
    return `<span${realestateDateHintAttr(jeonse)}>${formatPyeongPrice(jeonse.avgDepositPerPyeong10k)}</span> ${realestateChangeHtml(jeonse.change)} ${realestateCountHtml(jeonse)}`;
  }

  function realestateWolseCellHtml(wolse) {
    if (!wolse) return "-";
    const hintAttr = realestateDateHintAttr({
      change: wolse.depositChange ?? wolse.monthlyRentChange,
      baselineDate: wolse.baselineDate,
    });
    const depositText = `${formatPyeongPrice(wolse.avgDeposit10k)} ${realestateChangeHtml(wolse.depositChange)}`;
    const rentText = `${t("realestateMonthlyPrefix")}${formatPyeongPrice(wolse.avgMonthlyRent10k)} ${realestateChangeHtml(wolse.monthlyRentChange)}`;
    return `<span${hintAttr}>${depositText} / ${rentText}</span> ${realestateCountHtml(wolse)}`;
  }

  function realestateRowHtml(rawEntry, label, isOverall) {
    const entry = normalizeRealestateEntry(rawEntry);
    // 서울 전체(overall) 행은 검색 필터로 걸러지지 않게 data-district-name을 안 붙인다.
    const searchAttr = isOverall ? "" : ` data-district-name="${label}"`;
    return `
      <tr class="${isOverall ? "overall-row" : ""}"${searchAttr}>
        <td>${label}</td>
        <td>${realestateSaleCellHtml(entry.sale)}</td>
        <td>${realestateJeonseCellHtml(entry.jeonse)}</td>
        <td>${realestateWolseCellHtml(entry.wolse)}</td>
      </tr>`;
  }

  function applyRealestateSearch() {
    const input = document.getElementById("realestate-search-input");
    if (!input) return;
    const query = input.value.trim().toLowerCase();
    document.querySelectorAll("#realestate-grid tr[data-district-name]").forEach((tr) => {
      const name = (tr.getAttribute("data-district-name") || "").toLowerCase();
      tr.hidden = query.length > 0 && !name.includes(query);
    });
  }

  function realestateSortValue(rawEntry) {
    const entry = normalizeRealestateEntry(rawEntry);
    return entry.sale?.avgPricePerPyeong10k ?? entry.jeonse?.avgDepositPerPyeong10k ?? entry.avgPricePerPyeong10k ?? 0;
  }

  function renderRealestate(realestate) {
    const tbody = document.getElementById("realestate-grid");
    const meta = document.getElementById("realestate-meta");
    if (!realestate?.overall) {
      tbody.innerHTML = `<tr><td colspan="4" class="error">${t("realestateError")}</td></tr>`;
      meta.textContent = "";
      return;
    }

    const rows = [
      realestateRowHtml(realestate.overall, t("realestateOverallLabel"), true),
      ...(realestate.districts ?? [])
        .slice()
        .sort((a, b) => realestateSortValue(b) - realestateSortValue(a))
        .map((d) => realestateRowHtml(d, d.name, false)),
    ];
    tbody.innerHTML = rows.join("");
    meta.textContent = t("realestatePeriodLabel")(realestate.period ?? "");
    applyRealestateSearch(); // 테이블이 새로 그려지면 입력값 기준으로 다시 필터링
  }

  // 거래량(transactionCount)은 계약일이 아니라 "이번 달 누적 신고 건수"의
  // 스냅샷이라, 월중에는 대체로 우상향하다가 월이 바뀌는 시점에 다시 작은
  // 값으로 꺾이는 톱니 모양으로 나타난다(overall.sale 집계와 동일한 특성,
  // withSaleChange 주변 주석 참고).
  // "" = 서울 전체(overall). 구를 선택하면 history 각 날짜 스냅샷의
  // districts 배열에서 같은 code를 찾아 그 구만의 추이를 보여준다 -
  // 서버 쪽 realestate-history.json에 이미 구별 원값이 통째로 저장돼
  // 있어서(appendHistory가 overall/districts를 그대로 남김) 백엔드
  // 변경 없이 프론트에서만 필터링하면 된다.
  let selectedDistrictCode = "";

  function populateDistrictSelect() {
    const select = document.getElementById("realestate-district-select");
    if (!select) return;
    const districts = cache.realestate?.districts ?? [];
    select.innerHTML = [
      `<option value="">${t("realestateOverallOption")}</option>`,
      ...districts.map((d) => `<option value="${d.code}">${d.name}</option>`),
    ].join("");
    select.value = selectedDistrictCode;
  }

  function renderRealestateHistory(history) {
    populateDistrictSelect();
    const grid = document.getElementById("realestate-history-grid");
    if (!Array.isArray(history) || history.length < 2) {
      grid.innerHTML = "";
      return;
    }
    const recent = history.slice(-30);
    const getScoped = (h) =>
      selectedDistrictCode ? h.districts?.find((d) => d.code === selectedDistrictCode) : h.overall;
    const scopeName = selectedDistrictCode
      ? (cache.realestate?.districts ?? []).find((d) => d.code === selectedDistrictCode)?.name ?? ""
      : t("realestateOverallOption");
    const countFormat = (v) => t("realestateCountSuffix")(Math.round(v));
    // 가장 자주 찾는 두 지표(평당가/매매 거래량)를 앞에 두고 나머지는
    // <details>로 접어서, 카드가 계속 늘어나도 기본 화면은 짧게 유지한다.
    const series = [
      { label: t("realestateHistoryLabel")(scopeName), get: (h) => getScoped(h)?.sale?.avgPricePerPyeong10k, format: formatPyeongPrice },
      { label: t("realestateVolumeHistoryLabel")(scopeName), get: (h) => getScoped(h)?.sale?.transactionCount, format: countFormat },
      { label: t("realestateNational84HistoryLabel")(scopeName), get: (h) => getScoped(h)?.saleNational84?.avgPricePerPyeong10k, format: formatPyeongPrice },
      { label: t("realestateJeonseVolumeHistoryLabel")(scopeName), get: (h) => getScoped(h)?.jeonse?.transactionCount, format: countFormat },
      { label: t("realestateWolseVolumeHistoryLabel")(scopeName), get: (h) => getScoped(h)?.wolse?.transactionCount, format: countFormat },
    ];

    const cards = series
      .map(({ label, get, format }) => {
        const values = recent.map(get).filter((v) => typeof v === "number");
        if (values.length < 2) return null;
        const first = recent.find((h) => typeof get(h) === "number");
        const last = recent.slice().reverse().find((h) => typeof get(h) === "number");
        return historyCardHtml({ label, values, format, firstDate: first?.date, lastDate: last?.date });
      })
      .filter(Boolean);

    const PRIMARY_CARD_COUNT = 2;
    const primary = cards.slice(0, PRIMARY_CARD_COUNT);
    const secondary = cards.slice(PRIMARY_CARD_COUNT);

    let html = primary.join("");
    if (secondary.length > 0) {
      html += `
        <details class="history-more">
          <summary>${t("historyMoreToggle")(secondary.length)}</summary>
          <div class="history-grid history-grid-nested">${secondary.join("")}</div>
        </details>`;
    }
    grid.innerHTML = html;
  }

  // 뉴스 제목은 AI가 별도로 영어 번역(titleEn)을 만들어두면 그걸 쓰고,
  // 없으면(번역 실패/아직 처리 전) 원문 한국어로 대체한다.
  function pickTitle(item) {
    return locale === "en" ? item.titleEn ?? item.title : item.title;
  }

  // 카테고리 라벨. 실제 분류(어떤 기사가 어느 카테고리인지)는 수집 단계의
  // scripts/categories.mjs가 정하고, 기사에는 그 key만 저장된다. 여기 있는 건
  // key -> 화면 라벨 대응표뿐이라, categories.mjs에서 key를 추가할 때만 같이
  // 손보면 된다. (모르는 key는 아래에서 "기타"로 떨어진다.)
  const NEWS_CATEGORY_LABELS = {
    rates: { ko: "금리·예금·투자상품", en: "Rates & Deposits" },
    realestate: { ko: "부동산", en: "Real Estate" },
    stocks: { ko: "증시·환율", en: "Stocks & FX" },
    other: { ko: "기타", en: "Other" },
  };

  function newsCategoryLabel(key) {
    return (NEWS_CATEGORY_LABELS[key] ?? NEWS_CATEGORY_LABELS.other)[locale];
  }

  let newsCategoryFilter = "all";
  let newsQuery = "";

  // 읽은 기사 표시는 localStorage에만 저장한다(서버로 안 보냄). 무한정 쌓이지
  // 않게 최근 것만 남긴다.
  const READ_NEWS_KEY = "readNews";
  const READ_NEWS_MAX = 300;

  function loadReadNewsLinks() {
    try {
      const raw = JSON.parse(window.localStorage.getItem(READ_NEWS_KEY));
      return new Set(Array.isArray(raw) ? raw : []);
    } catch {
      return new Set();
    }
  }

  let readNewsLinks = loadReadNewsLinks();

  function markNewsRead(link) {
    if (!link || readNewsLinks.has(link)) return;
    readNewsLinks.add(link);
    const trimmed = [...readNewsLinks].slice(-READ_NEWS_MAX);
    readNewsLinks = new Set(trimmed);
    try {
      window.localStorage.setItem(READ_NEWS_KEY, JSON.stringify(trimmed));
    } catch {
      // 사생활 보호 모드 등 저장이 막힌 환경 - 표시만 못 할 뿐 기능엔 지장 없음
    }
  }

  function absoluteNewsTime(iso) {
    return new Date(iso).toLocaleString(locale === "ko" ? "ko-KR" : "en-US", {
      timeZone: "Asia/Seoul",
      dateStyle: "short",
      timeStyle: "short",
    });
  }

  // 하루 여러 번 갱신되다 보니 "몇 시 몇 분"보다 "몇 시간 전"이 신선도를 훨씬
  // 빨리 알려준다. 하루가 넘어가면 상대 표기가 오히려 헷갈려서 날짜로 돌아간다.
  function newsTimeLabel(iso) {
    if (!iso) return "";
    const then = new Date(iso).getTime();
    if (!Number.isFinite(then)) return "";
    const diffMin = Math.round((Date.now() - then) / 60000);
    if (diffMin < 1) return t("newsJustNow");
    if (diffMin < 60) return t("newsMinutesAgo")(diffMin);
    if (diffMin < 60 * 24) return t("newsHoursAgo")(Math.floor(diffMin / 60));
    return absoluteNewsTime(iso);
  }

  function newsItemMatches(item) {
    if (newsCategoryFilter !== "all" && (item.category ?? "other") !== newsCategoryFilter) return false;
    const query = newsQuery.trim().toLowerCase();
    if (!query) return true;
    return [item.title, item.titleEn, item.preview, item.source]
      .filter(Boolean)
      .join(" ")
      .toLowerCase()
      .includes(query);
  }

  function renderNewsFilters(items) {
    const box = document.getElementById("news-filters");
    // category 필드가 없던 시절에 저장된 지난 기록은 전부 "기타"로 몰려서
    // 필터가 의미가 없다. 그런 날짜에는 칩 자체를 숨긴다.
    if (!items.some((item) => item.category)) {
      box.hidden = true;
      return;
    }
    box.hidden = false;

    const counts = new Map();
    for (const item of items) {
      const key = item.category ?? "other";
      counts.set(key, (counts.get(key) ?? 0) + 1);
    }
    const chips = [{ key: "all", label: t("newsFilterAll"), count: items.length }];
    for (const key of Object.keys(NEWS_CATEGORY_LABELS)) {
      if (counts.has(key)) chips.push({ key, label: newsCategoryLabel(key), count: counts.get(key) });
    }

    box.innerHTML = chips
      .map(
        (chip) =>
          `<button type="button" class="news-chip" data-category="${chip.key}" aria-pressed="${
            chip.key === newsCategoryFilter
          }">${chip.label}<span class="news-chip-count">${chip.count}</span></button>`
      )
      .join("");
  }

  function newsItemHtml(item) {
    const timeLabel = newsTimeLabel(item.publishedAt);
    const timeTitle = item.publishedAt ? ` title="${absoluteNewsTime(item.publishedAt)}"` : "";
    // 미리보기는 원문 그대로의 한국어라, 영어 화면에서는 제목만 보여준다
    // (제목은 titleEn으로 번역본이 따로 있음).
    const preview =
      locale === "ko" && item.preview ? `<div class="news-preview">${escapeHtml(item.preview)}</div>` : "";
    const dupes = item.dupes?.length
      ? `<details class="news-dupes">
           <summary>${t("newsDupes")(item.dupes.length)}</summary>
           <ul>${item.dupes
             .map(
               (d) =>
                 `<li><a href="${d.link}" target="_blank" rel="noopener">${escapeHtml(d.source)}</a> · ${escapeHtml(
                   d.title
                 )}</li>`
             )
             .join("")}</ul>
         </details>`
      : "";
    const readClass = readNewsLinks.has(item.link) ? " read" : "";
    return `<li class="news-item${readClass}">
      <a href="${item.link}" target="_blank" rel="noopener">${pickTitle(item)}</a>
      <div class="news-meta"${timeTitle}>${item.source} · ${timeLabel}</div>
      ${preview}
      ${dupes}
    </li>`;
  }

  function renderNews(news) {
    const list = document.getElementById("news-list");
    const controls = document.getElementById("news-controls");
    if (!news || !news.items?.length) {
      controls.hidden = true;
      list.innerHTML = `<li class="error">${t("newsError")}</li>`;
      return;
    }

    controls.hidden = false;
    renderNewsFilters(news.items);

    const items = news.items.filter(newsItemMatches);
    list.innerHTML = items.length
      ? items.map(newsItemHtml).join("")
      : `<li class="news-empty">${t("newsNoMatch")}</li>`;
  }

  // summary 필드는 { ko, en } 객체(현재 포맷)이거나, 그 이전에 저장된
  // 한국어 전용 문자열(과거 아카이브 기록)일 수 있어 둘 다 처리한다.
  function pickSummaryText(summaryField) {
    if (!summaryField) return null;
    if (typeof summaryField === "string") return summaryField;
    return summaryField[locale] ?? summaryField.ko ?? null;
  }

  // 요약 카테고리에 딸린 기사(items)는 link만 기준으로 저장돼 있고 제목은
  // 한국어 원문뿐이라, 영어 로케일에서는 오늘자/히스토리 뉴스 캐시에서 같은
  // link를 찾아 translate-news.mjs가 만들어둔 titleEn을 재사용한다.
  function findNewsItemByLink(link) {
    const pools = [cache.news?.items, ...(cache.newsHistory ?? []).map((h) => h.items)].filter(Boolean);
    for (const items of pools) {
      const found = items.find((i) => i.link === link);
      if (found) return found;
    }
    return null;
  }

  function pickCategoryItemTitle(item) {
    if (locale !== "en") return item.title;
    return findNewsItemByLink(item.link)?.titleEn ?? item.title;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // categories 필드가 없는 과거 형식(줄바꿈으로 구분된 통짜 텍스트)도, "- 라벨: 내용"
  // 형태인 줄(주로 폴백 시 헤드라인 나열 줄)은 라벨만이라도 굵게 표시한다.
  // LLM이 생성한 성공 문장 줄은 애초에 라벨이 안 붙어 있어 이 처리로도 못 살린다.
  function plainSummaryHtml(text) {
    return text
      .replace(/\n{4,}/g, "\n\n\n") // 빈 줄이 연속 두 줄을 넘지 않도록
      .trim()
      .split("\n")
      .map((line) => {
        const m = line.match(/^-\s*([^:]+):\s*(.*)$/);
        if (!m) return escapeHtml(line);
        const [, label, rest] = m;
        return `<strong class="summary-plain-label">${escapeHtml(label)}:</strong> ${escapeHtml(rest)}`;
      })
      .join("<br>");
  }

  function summaryCategoryHtml(cat) {
    const label = locale === "en" ? cat.nameEn : cat.name;
    const line = locale === "en" ? cat.lineEn : cat.lineKo;
    const linksHtml = (cat.items ?? [])
      .map(
        (item) =>
          `<li><a href="${item.link}" target="_blank" rel="noopener">${pickCategoryItemTitle(item)}</a><span class="summary-link-source"> · ${item.source}</span></li>`
      )
      .join("");
    return (
      `<div class="summary-category">` +
      `<div class="summary-category-label">${label}</div>` +
      `<div class="summary-category-line">${line}</div>` +
      (linksHtml ? `<ul class="summary-links">${linksHtml}</ul>` : "") +
      `</div>`
    );
  }

  function renderSummary(summary) {
    const box = document.getElementById("summary-box");
    const categories = summary?.categories;
    const hasCategories = Array.isArray(categories) && categories.length > 0;
    const text = pickSummaryText(summary?.summary);

    if (!hasCategories && !text) {
      box.classList.add("placeholder");
      box.textContent = t("summaryEmpty");
      return;
    }

    box.classList.remove("placeholder");
    if (hasCategories) {
      box.innerHTML = categories.map(summaryCategoryHtml).join("");
    } else {
      // 카테고리 링크 정보가 없는 과거 아카이브 기록은 통짜 텍스트로 표시하되,
      // "- 라벨: 내용" 형태인 줄만이라도 라벨을 굵게 강조한다.
      box.innerHTML = plainSummaryHtml(text);
    }

    const meta = document.createElement("span");
    meta.className = "summary-meta";
    meta.textContent = t("summaryMeta")(summary.model ?? "AI", fmtUpdated(summary.updatedAt));
    box.appendChild(meta);
  }

  // 아카이브(?date=) 조회 시에는 실시간 데이터 대신 각 히스토리 파일에서
  // 해당 날짜 기록을 찾아 그대로 같은 렌더 함수에 넘긴다. 히스토리 항목은
  // updatedAt만 없을 뿐 나머지 필드 구조는 실시간 파일과 동일하다.
  function effectiveNews() {
    if (!isArchiveView) return cache.news;
    const entry = findByDate(cache.newsHistory, viewDate);
    return entry ? { items: entry.items } : null;
  }
  function effectiveSummary() {
    if (!isArchiveView) return cache.summary;
    const entry = findByDate(cache.summaryHistory, viewDate);
    // 히스토리 기록에는 updatedAt이 없어서 summaryMeta 표시용으로 날짜
    // 자정(KST) 기준 값을 대신 채워 넣는다.
    return entry ? { ...entry, updatedAt: entry.updatedAt ?? `${entry.date}T00:00:00+09:00` } : null;
  }
  function effectiveMarket() {
    if (!isArchiveView) return cache.market;
    return findByDate(cache.history, viewDate);
  }
  function effectiveRealestate() {
    if (!isArchiveView) return cache.realestate;
    return findByDate(cache.realestateHistory, viewDate);
  }

  function renderAll() {
    const news = effectiveNews();
    const summary = effectiveSummary();
    const market = effectiveMarket();
    const realestate = effectiveRealestate();

    renderMarket(market);
    renderNews(news);
    renderSummary(summary);
    renderHistory(cache.history);
    renderRealestate(realestate);
    renderRealestateHistory(cache.realestateHistory);

    const backLink = document.getElementById("archive-back-link");
    const updateSchedule = document.getElementById("update-schedule");
    if (isArchiveView) {
      backLink.hidden = false;
      backLink.textContent = t("archiveBackLink");
      document.getElementById("updated").textContent = t("archiveViewing")(viewDate);
      updateSchedule.hidden = true; // 지난 기록을 보는 중에는 "매일 갱신" 안내가 혼란스러움
      return;
    }
    backLink.hidden = true;
    updateSchedule.hidden = false;
    updateSchedule.textContent = t("updateSchedule");

    const latestSources = [market, news, summary].filter(Boolean);
    const latest = latestSources.map((v) => v.updatedAt).filter(Boolean).sort().pop();
    document.getElementById("updated").textContent = latest
      ? t("lastUpdated")(fmtUpdated(latest))
      : t("lastUpdatedUnknown");
  }

  function setMetaContent(selector, content) {
    const el = document.querySelector(selector);
    if (el) el.setAttribute("content", content);
  }

  function applyLocale(next) {
    locale = next;
    window.localStorage.setItem("lang", locale);
    document.documentElement.setAttribute("lang", locale);
    document.title = t("title");
    setMetaContent('meta[name="description"]', t("description"));
    setMetaContent('meta[property="og:title"]', t("title"));
    setMetaContent('meta[property="og:description"]', t("description"));
    setMetaContent('meta[name="twitter:title"]', t("title"));
    setMetaContent('meta[name="twitter:description"]', t("description"));
    document.getElementById("page-title").textContent = t("title");
    document.getElementById("summary-heading").textContent = t("summaryHeading");
    document.getElementById("market-heading").textContent = t("marketHeading");
    document.getElementById("market-th-indicator").textContent = t("marketThIndicator");
    document.getElementById("market-th-value").textContent = t("marketThValue");
    document.getElementById("market-th-change").textContent = t("marketThChange");
    document.getElementById("rates-link").textContent = t("ratesLink");
    document.getElementById("realestate-heading").textContent = t("realestateHeading");
    document.getElementById("realestate-unit-caption").textContent = t("realestateUnitCaption");
    document.getElementById("re-th-district").textContent = t("realestateTagDistrict");
    document.getElementById("re-th-sale").textContent = t("realestateTagSale");
    document.getElementById("re-th-jeonse").textContent = t("realestateTagJeonse");
    document.getElementById("re-th-wolse").textContent = t("realestateTagWolse");
    document.getElementById("realestate-district-select-label").textContent = t("realestateDistrictSelectLabel");
    document.getElementById("realestate-search-input").placeholder = t("realestateSearchPlaceholder");
    document.getElementById("news-heading").textContent = t("newsHeading");
    document.getElementById("news-search-input").placeholder = t("newsSearchPlaceholder");
    document.getElementById("news-archive-link").textContent = t("newsArchiveLink");
    document.getElementById("archive-heading").textContent = t("archiveHeading");
    document.getElementById("archive-date-jump-label").textContent = t("archiveDateJumpLabel");
    document.getElementById("archive-date-go").textContent = t("archiveDateGo");
    document.getElementById("footer-privacy-link").textContent = t("footerPrivacyLink");

    const notice = document.getElementById("content-notice");
    const noticeText = t("contentNotice");
    notice.hidden = !noticeText;
    notice.textContent = noticeText ?? "";

    renderAll();
  }

  document.getElementById("lang-toggle").addEventListener("click", () => {
    applyLocale(locale === "en" ? "ko" : "en");
  });

  document.getElementById("theme-toggle").addEventListener("click", () => {
    const order = ["auto", "light", "dark"];
    applyTheme(order[(order.indexOf(theme) + 1) % order.length]);
  });

  // 오늘보다 미래 날짜는 애초에 데이터가 없으니 날짜 선택기에서 막아둔다.
  document.getElementById("archive-date-input").max = kstToday();

  document.getElementById("archive-date-jump").addEventListener("submit", (e) => {
    e.preventDefault();
    const value = document.getElementById("archive-date-input").value;
    if (!value) return;
    location.href = `./index.html?date=${value}`;
  });

  document.getElementById("realestate-district-select").addEventListener("change", (e) => {
    selectedDistrictCode = e.target.value;
    renderRealestateHistory(cache.realestateHistory);
  });

  document.getElementById("realestate-search-input").addEventListener("input", applyRealestateSearch);

  document.getElementById("news-filters").addEventListener("click", (e) => {
    const chip = e.target.closest(".news-chip");
    if (!chip) return;
    newsCategoryFilter = chip.dataset.category;
    renderNews(effectiveNews());
  });

  document.getElementById("news-search-input").addEventListener("input", (e) => {
    newsQuery = e.target.value;
    renderNews(effectiveNews());
  });

  // 기사 링크는 새 탭으로 열려서 페이지가 그대로 남는다. 클릭 즉시 읽음 표시를
  // 반영하되, 목록 전체를 다시 그리면 펼쳐둔 "다른 매체" 등이 닫히므로 해당
  // 항목에만 클래스를 붙인다.
  document.getElementById("news-list").addEventListener("click", (e) => {
    const link = e.target.closest(".news-item > a");
    if (!link) return;
    markNewsRead(link.getAttribute("href"));
    link.parentElement.classList.add("read");
  });

  // ---- 공유하기 -----------------------------------------------------------
  // 모바일 등 Web Share API 지원 브라우저는 네이티브 공유 시트를 띄우고,
  // 미지원 환경(대부분의 데스크톱 브라우저)은 현재 URL(아카이브의 ?date=
  // 포함)을 클립보드로 복사한다. 두 방식 다 실패하면 prompt로 링크를 보여줘
  // 수동 복사라도 가능하게 한다.
  const shareButton = document.getElementById("share-button");
  const shareIcon = shareButton.querySelector("span");

  function showShareFeedback() {
    shareIcon.textContent = "✅";
    setTimeout(() => {
      shareIcon.textContent = "📤";
    }, 1500);
  }

  async function shareCurrentPage() {
    const shareData = { title: document.title, url: location.href };

    if (navigator.share) {
      try {
        await navigator.share(shareData);
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return; // 사용자가 공유 시트를 취소함
        // 공유 시트 자체가 실패하면 클립보드 복사로 폴백
      }
    }

    try {
      await navigator.clipboard.writeText(location.href);
      showShareFeedback();
    } catch {
      window.prompt("Copy this link:", location.href);
    }
  }

  shareButton.addEventListener("click", shareCurrentPage);

  // cache 키 -> 히스토리 파일 이름
  const HISTORY_FILES = {
    history: "market-history",
    summaryHistory: "summary-history",
    newsHistory: "news-history",
    realestateHistory: "realestate-history",
  };

  async function loadHistoryInto(cacheKey) {
    try {
      cache[cacheKey] = await loadJson(HISTORY_FILES[cacheKey]);
    } catch {
      cache[cacheKey] = null; // 추이 카드만 비고 오늘 데이터 화면은 그대로 동작
    }
  }

  async function main() {
    locale = getInitialLocale();

    // 히스토리 파일은 4개 합쳐 100KB가 넘는데, 오늘 화면의 첫 렌더(요약/시장/
    // 부동산/뉴스)에는 필요 없다. 오늘 데이터부터 그리고 추이 카드는 뒤따라 채운다.
    const todayKeys = ["market", "news", "summary", "realestate"];
    const results = await Promise.allSettled(todayKeys.map((key) => loadJson(key)));
    todayKeys.forEach((key, i) => {
      cache[key] = results[i].status === "fulfilled" ? results[i].value : null;
    });

    // 아카이브(?date=) 조회는 히스토리가 곧 본문이라 먼저 다 받고 한 번에 그린다.
    if (isArchiveView) {
      await Promise.all(Object.keys(HISTORY_FILES).map(loadHistoryInto));
      applyLocale(locale);
      return;
    }

    applyLocale(locale);

    // 오늘 화면에서 히스토리가 쓰이는 곳은 추이 스파크라인뿐이다
    // (뉴스/요약 히스토리는 아카이브 조회에서만 필요해서 아예 받지 않는다).
    await Promise.all([loadHistoryInto("history"), loadHistoryInto("realestateHistory")]);
    renderHistory(cache.history);
    renderRealestateHistory(cache.realestateHistory);
  }

  main();

  // 아카이브(?date=) 조회 중에는 과거 환율 값을 보여줘야 하므로 실시간
  // 환율로 덮어쓰지 않는다.
  if (!isArchiveView) {
    fetchLiveUsdKrw();
    setInterval(fetchLiveUsdKrw, 5 * 60 * 1000); // 소스 자체가 대략 1시간마다 갱신되므로 5분이면 충분
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }

  // ---- GA4 / 애드센스 -----------------------------------------------
  // 이 값들은 kyhsa93.github.io 블로그(같은 origin, 같은 Google 계정)와
  // 동일한 GA4 속성/애드센스 게시자를 그대로 재사용한다. GA 측정 ID와
  // 애드센스 게시자 ID는 공개 값(모든 방문자의 브라우저 네트워크 탭에
  // 그대로 노출됨)이라 시크릿으로 다룰 필요가 없다.
  const GA_MEASUREMENT_ID = "G-Z1LH7S1ZE5";
  const ADSENSE_CLIENT_ID = "ca-pub-1195159445218373";

  window.dataLayer = window.dataLayer || [];
  window.gtag = function gtag() {
    window.dataLayer.push(arguments);
  };
  window.gtag("js", new Date());
  window.gtag("config", GA_MEASUREMENT_ID);

  const gaScript = document.createElement("script");
  gaScript.async = true;
  gaScript.src = `https://www.googletagmanager.com/gtag/js?id=${GA_MEASUREMENT_ID}`;
  document.head.appendChild(gaScript);

  const adScript = document.createElement("script");
  adScript.async = true;
  adScript.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${ADSENSE_CLIENT_ID}`;
  adScript.crossOrigin = "anonymous";
  document.head.appendChild(adScript);
</script>
