<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#253e81">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>경제·부동산 데일리 다이제스트</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666;
    --card: #f5f5f7;
    --border: #e2e2e5;
    --up: #d64545;
    --down: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #eaeaea;
      --muted: #9a9a9a;
      --card: #1a1d24;
      --border: #2a2d35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.5;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .updated {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .lang-toggle {
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    color: var(--fg);
  }
  .content-notice {
    color: var(--muted);
    font-size: 0.8rem;
    margin: -12px 0 20px;
  }
  section {
    margin-bottom: 32px;
  }
  h2 {
    font-size: 1.05rem;
    margin: 0 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .market-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }
  .market-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .market-card .label {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 4px;
  }
  .market-card .value {
    font-size: 1.3rem;
    font-weight: 600;
  }
  .market-card .change {
    font-size: 0.85rem;
    margin-top: 2px;
  }
  .change.up { color: var(--up); }
  .change.down { color: var(--down); }
  ul.news-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .news-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .news-item:last-child { border-bottom: none; }
  .news-item a {
    color: var(--fg);
    text-decoration: none;
    font-size: 0.95rem;
  }
  .news-item a:hover { text-decoration: underline; }
  .news-meta {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 2px;
  }
  .placeholder {
    color: var(--muted);
    font-size: 0.9rem;
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  #summary-box {
    color: var(--fg);
    font-size: 0.95rem;
    white-space: pre-wrap;
  }
  .summary-meta {
    display: block;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 10px;
  }
  .error {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .history-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }
  .history-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .history-card .label {
    color: var(--muted);
    font-size: 0.78rem;
    margin-bottom: 6px;
  }
  .history-card svg {
    display: block;
    width: 100%;
    height: 56px;
  }
  .history-card .range {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.72rem;
    margin-top: 4px;
  }
  .archive-list details {
    border-bottom: 1px solid var(--border);
    padding: 8px 0;
  }
  .archive-list details:last-child { border-bottom: none; }
  .archive-list summary {
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--fg);
  }
  .archive-content {
    margin-top: 8px;
    padding-left: 4px;
    color: var(--fg);
    font-size: 0.88rem;
    white-space: pre-wrap;
  }
  .archive-news-list {
    margin-top: 10px;
    padding-left: 4px;
  }
  .archive-news-list .news-item {
    padding: 6px 0;
  }
  .archive-news-list .news-item a {
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="page-title">경제·부동산 데일리 다이제스트</h1>
      <div class="updated" id="updated">불러오는 중...</div>
    </div>
    <button class="lang-toggle" type="button" id="lang-toggle" aria-label="Switch language">
      <span aria-hidden="true">🌐</span>
    </button>
  </header>

  <div class="content-notice" id="content-notice" hidden></div>

  <section id="summary-section">
    <h2 id="summary-heading">오늘의 AI 요약</h2>
    <div class="placeholder" id="summary-box">불러오는 중...</div>
  </section>

  <section id="market-section">
    <h2 id="market-heading">자산 시장 지표</h2>
    <div class="market-grid" id="market-grid">
      <div class="error">불러오는 중...</div>
    </div>
    <div class="history-grid" id="history-grid"></div>
  </section>

  <section id="realestate-section">
    <h2 id="realestate-heading">한국 부동산 가격 추이</h2>
    <div class="market-grid" id="realestate-grid">
      <div class="error">불러오는 중...</div>
    </div>
    <div class="history-grid" id="realestate-history-grid"></div>
    <div class="summary-meta" id="realestate-meta"></div>
  </section>

  <section id="news-section">
    <h2 id="news-heading">오늘의 경제·부동산 뉴스</h2>
    <ul class="news-list" id="news-list">
      <li class="error">불러오는 중...</li>
    </ul>
  </section>

  <section id="archive-section">
    <h2 id="archive-heading">지난 요약 기록</h2>
    <div class="archive-list" id="archive-list">
      <div class="error">불러오는 중...</div>
    </div>
  </section>
</main>

<script>
  // ---- i18n -----------------------------------------------------------
  // 이 사이트의 실제 콘텐츠(뉴스 제목, AI 요약)는 한국어 소스 그대로이며
  // 번역하지 않는다. 언어 전환은 UI 레이블/문구에만 적용된다.
  const T = {
    ko: {
      title: "경제·부동산 데일리 다이제스트",
      lastUpdated: (s) => `마지막 갱신: ${s}`,
      lastUpdatedUnknown: "갱신 정보를 불러오지 못했습니다.",
      loading: "불러오는 중...",
      contentNotice: null,
      summaryHeading: "오늘의 AI 요약",
      summaryEmpty: "아직 생성된 요약이 없습니다.",
      summaryMeta: (model, date) => `${model} 생성 · ${date}`,
      marketHeading: "자산 시장 지표",
      marketError: "데이터를 불러오지 못했습니다.",
      marketEmpty: "데이터 없음",
      kospiLabel: "코스피",
      usdKrwLabel: "원/달러 환율",
      baseRateLabel: "한국은행 기준금리",
      baseRateSince: (s) => `${s} 부터`,
      historyKospiLabel: "코스피 (최근 추이)",
      historyUsdKrwLabel: "원/달러 환율 (최근 추이)",
      realestateHeading: "한국 부동산 가격 추이",
      realestateError: "데이터를 불러오지 못했습니다.",
      realestateOverallLabel: "서울 5개구 평균",
      realestateCountLabel: (n) => `최근 2개월 거래 ${n}건`,
      realestatePeriodLabel: (period) => `국토교통부 실거래가 기준 (${period})`,
      realestateHistoryLabel: "서울 평균 평당가 추이 (최근)",
      newsHeading: "오늘의 경제·부동산 뉴스",
      newsError: "데이터를 불러오지 못했습니다.",
      archiveHeading: "지난 요약 기록",
      archiveEmpty: "아직 지난 기록이 없습니다.",
      archiveMore: (n) => `이전 기록 ${n}건 더 있음`,
    },
    en: {
      title: "Econ & Real Estate Digest",
      lastUpdated: (s) => `Last updated: ${s}`,
      lastUpdatedUnknown: "Could not load update info.",
      loading: "Loading...",
      contentNotice: "News headlines are machine-translated from Korean by a small local AI model. Company and person names in particular may be mistranslated as unrelated real entities - each headline links to the original Korean article for verification.",
      summaryHeading: "Today's AI Summary",
      summaryEmpty: "No summary generated yet.",
      summaryMeta: (model, date) => `Generated by ${model} · ${date}`,
      marketHeading: "Market Indicators",
      marketError: "Failed to load data.",
      marketEmpty: "No data",
      kospiLabel: "KOSPI",
      usdKrwLabel: "USD/KRW",
      baseRateLabel: "BOK Base Rate",
      baseRateSince: (s) => `since ${s}`,
      historyKospiLabel: "KOSPI (recent trend)",
      historyUsdKrwLabel: "USD/KRW (recent trend)",
      realestateHeading: "Korean Real Estate Price Trend",
      realestateError: "Failed to load data.",
      realestateOverallLabel: "Seoul 5-district average",
      realestateCountLabel: (n) => `${n} transactions in last 2 months`,
      realestatePeriodLabel: (period) => `Based on MOLIT transaction data (${period})`,
      realestateHistoryLabel: "Seoul avg. price/pyeong trend (recent)",
      newsHeading: "Today's Economy & Real Estate News",
      newsError: "Failed to load data.",
      archiveHeading: "Past Summary Archive",
      archiveEmpty: "No past records yet.",
      archiveMore: (n) => `${n} more past entries`,
    },
  };

  let locale = "en";
  function t(key) {
    return T[locale][key];
  }

  function getInitialLocale() {
    const saved = window.localStorage.getItem("lang");
    return saved === "en" || saved === "ko" ? saved : "en";
  }

  // ---- data cache (재조회 없이 언어 전환 시 재렌더링하기 위함) ----------
  const cache = {
    market: null,
    news: null,
    summary: null,
    history: null,
    summaryHistory: null,
    newsHistory: null,
    realestate: null,
    realestateHistory: null,
  };

  function fmtUpdated(iso) {
    if (!iso) return "-";
    const d = new Date(iso);
    return d.toLocaleString(locale === "ko" ? "ko-KR" : "en-US", {
      timeZone: "Asia/Seoul",
      dateStyle: "medium",
      timeStyle: "short",
    }) + " KST";
  }

  async function loadJson(name) {
    const res = await fetch(`./data/${name}.json?_=${Date.now()}`);
    if (!res.ok) throw new Error(`${name} load failed`);
    return res.json();
  }

  function directionClass(direction) {
    if (direction === "RISING") return "up";
    if (direction === "FALLING") return "down";
    return "";
  }

  function renderMarket(market) {
    const grid = document.getElementById("market-grid");
    if (!market) {
      grid.innerHTML = `<div class="error">${t("marketError")}</div>`;
      return;
    }
    const cards = [];
    if (market.kospi) {
      cards.push(`
        <div class="market-card">
          <div class="label">${t("kospiLabel")}</div>
          <div class="value">${market.kospi.value}</div>
          <div class="change ${directionClass(market.kospi.direction)}">${market.kospi.change ?? ""}</div>
        </div>`);
    }
    if (market.usdKrw) {
      cards.push(`
        <div class="market-card">
          <div class="label">${t("usdKrwLabel")}</div>
          <div class="value">${Number(market.usdKrw.value).toFixed(2)}</div>
        </div>`);
    }
    if (market.baseRate) {
      cards.push(`
        <div class="market-card">
          <div class="label">${t("baseRateLabel")}</div>
          <div class="value">${market.baseRate.value}%</div>
          <div class="change">${t("baseRateSince")(market.baseRate.effectiveFrom)}</div>
        </div>`);
    }
    grid.innerHTML = cards.join("") || `<div class="error">${t("marketEmpty")}</div>`;
  }

  function sparklineSvg(values) {
    const w = 280, h = 56, pad = 4;
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    const step = values.length > 1 ? (w - pad * 2) / (values.length - 1) : 0;
    const points = values
      .map((v, i) => {
        const x = pad + i * step;
        const y = h - pad - ((v - min) / range) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      })
      .join(" ");
    const last = values[values.length - 1];
    const lastX = pad + (values.length - 1) * step;
    const lastY = h - pad - ((last - min) / range) * (h - pad * 2);
    const rising = values.length > 1 && last >= values[0];
    const color = rising ? "var(--up)" : "var(--down)";
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" />
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2.5" fill="${color}" />
    </svg>`;
  }

  function parseNumeric(v) {
    if (typeof v === "number") return v;
    if (typeof v === "string") return parseFloat(v.replace(/,/g, ""));
    return NaN;
  }

  function renderHistory(history) {
    const grid = document.getElementById("history-grid");
    if (!Array.isArray(history) || history.length < 2) {
      grid.innerHTML = "";
      return;
    }
    const recent = history.slice(-30);
    const series = [
      { label: t("historyKospiLabel"), get: (h) => parseNumeric(h.kospi?.value) },
      { label: t("historyUsdKrwLabel"), get: (h) => parseNumeric(h.usdKrw?.value) },
    ];

    grid.innerHTML = series
      .map(({ label, get }) => {
        const values = recent.map(get).filter((v) => !Number.isNaN(v));
        if (values.length < 2) return "";
        const first = recent.find((h) => !Number.isNaN(get(h)));
        const last = recent.slice().reverse().find((h) => !Number.isNaN(get(h)));
        return `
          <div class="history-card">
            <div class="label">${label}</div>
            ${sparklineSvg(values)}
            <div class="range"><span>${first?.date ?? ""}</span><span>${last?.date ?? ""}</span></div>
          </div>`;
      })
      .join("");
  }

  function formatPyeongPrice(value10k) {
    if (locale === "ko") return `${value10k.toLocaleString("ko-KR")}만원`;
    return `₩${(value10k / 100).toLocaleString("en-US", { maximumFractionDigits: 1 })}M`;
  }

  function renderRealestate(realestate) {
    const grid = document.getElementById("realestate-grid");
    const meta = document.getElementById("realestate-meta");
    if (!realestate?.overall) {
      grid.innerHTML = `<div class="error">${t("realestateError")}</div>`;
      meta.textContent = "";
      return;
    }

    const cards = [
      `<div class="market-card">
         <div class="label">${t("realestateOverallLabel")}</div>
         <div class="value">${formatPyeongPrice(realestate.overall.avgPricePerPyeong10k)}</div>
         <div class="change">${t("realestateCountLabel")(realestate.overall.transactionCount)}</div>
       </div>`,
      ...(realestate.districts ?? []).map(
        (d) => `
        <div class="market-card">
          <div class="label">${d.name}</div>
          <div class="value">${formatPyeongPrice(d.avgPricePerPyeong10k)}</div>
          <div class="change">${t("realestateCountLabel")(d.transactionCount)}</div>
        </div>`
      ),
    ];
    grid.innerHTML = cards.join("");
    meta.textContent = t("realestatePeriodLabel")(realestate.period ?? "");
  }

  function renderRealestateHistory(history) {
    const grid = document.getElementById("realestate-history-grid");
    if (!Array.isArray(history) || history.length < 2) {
      grid.innerHTML = "";
      return;
    }
    const recent = history.slice(-30);
    const values = recent.map((h) => h.overall?.avgPricePerPyeong10k).filter((v) => typeof v === "number");
    if (values.length < 2) {
      grid.innerHTML = "";
      return;
    }
    const first = recent.find((h) => typeof h.overall?.avgPricePerPyeong10k === "number");
    const last = recent.slice().reverse().find((h) => typeof h.overall?.avgPricePerPyeong10k === "number");
    grid.innerHTML = `
      <div class="history-card">
        <div class="label">${t("realestateHistoryLabel")}</div>
        ${sparklineSvg(values)}
        <div class="range"><span>${first?.date ?? ""}</span><span>${last?.date ?? ""}</span></div>
      </div>`;
  }

  // 뉴스 제목은 AI가 별도로 영어 번역(titleEn)을 만들어두면 그걸 쓰고,
  // 없으면(번역 실패/아직 처리 전) 원문 한국어로 대체한다.
  function pickTitle(item) {
    return locale === "en" ? item.titleEn ?? item.title : item.title;
  }

  function renderNews(news) {
    const list = document.getElementById("news-list");
    if (!news || !news.items?.length) {
      list.innerHTML = `<li class="error">${t("newsError")}</li>`;
      return;
    }
    list.innerHTML = news.items
      .map((item) => {
        const date = item.publishedAt
          ? new Date(item.publishedAt).toLocaleString(locale === "ko" ? "ko-KR" : "en-US", {
              timeZone: "Asia/Seoul",
              dateStyle: "short",
              timeStyle: "short",
            })
          : "";
        return `
          <li class="news-item">
            <a href="${item.link}" target="_blank" rel="noopener">${pickTitle(item)}</a>
            <div class="news-meta">${item.source} · ${date}</div>
          </li>`;
      })
      .join("");
  }

  // summary 필드는 { ko, en } 객체(현재 포맷)이거나, 그 이전에 저장된
  // 한국어 전용 문자열(과거 아카이브 기록)일 수 있어 둘 다 처리한다.
  function pickSummaryText(summaryField) {
    if (!summaryField) return null;
    if (typeof summaryField === "string") return summaryField;
    return summaryField[locale] ?? summaryField.ko ?? null;
  }

  function renderSummary(summary) {
    const box = document.getElementById("summary-box");
    const text = pickSummaryText(summary?.summary);
    if (!text) {
      box.classList.add("placeholder");
      box.textContent = t("summaryEmpty");
      return;
    }
    box.classList.remove("placeholder");
    box.textContent = text;
    const meta = document.createElement("span");
    meta.className = "summary-meta";
    meta.textContent = t("summaryMeta")(summary.model ?? "AI", fmtUpdated(summary.updatedAt));
    box.appendChild(meta);
  }

  const ARCHIVE_DISPLAY_LIMIT = 30;
  const ARCHIVE_NEWS_LIMIT = 20;

  function buildArchiveNewsList(items) {
    const ul = document.createElement("ul");
    ul.className = "news-list archive-news-list";
    for (const item of (items ?? []).slice(0, ARCHIVE_NEWS_LIMIT)) {
      const li = document.createElement("li");
      li.className = "news-item";
      const a = document.createElement("a");
      a.href = item.link;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = pickTitle(item);
      const meta = document.createElement("div");
      meta.className = "news-meta";
      meta.textContent = item.source ?? "";
      li.append(a, meta);
      ul.appendChild(li);
    }
    return ul;
  }

  function renderArchive(summaryHistory, newsHistory) {
    const list = document.getElementById("archive-list");
    const today = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());

    const summaryByDate = new Map((Array.isArray(summaryHistory) ? summaryHistory : []).map((h) => [h.date, h.summary]));
    const newsByDate = new Map((Array.isArray(newsHistory) ? newsHistory : []).map((h) => [h.date, h.items]));

    // 요약과 뉴스 히스토리는 별도 파일이라 한쪽만 있는 날짜도 있을 수 있음
    // (예: 이 기능 추가 전 날짜를 소급 반영한 경우) -> 날짜 합집합 기준으로 보여준다.
    const dates = new Set([...summaryByDate.keys(), ...newsByDate.keys()]);
    const past = [...dates].filter((d) => d !== today).sort((a, b) => b.localeCompare(a));

    if (!past.length) {
      list.innerHTML = `<div class="error">${t("archiveEmpty")}</div>`;
      return;
    }

    const shown = past.slice(0, ARCHIVE_DISPLAY_LIMIT);
    list.innerHTML = "";
    for (const date of shown) {
      const details = document.createElement("details");
      const summaryEl = document.createElement("summary");
      summaryEl.textContent = date;
      details.appendChild(summaryEl);

      const summaryText = pickSummaryText(summaryByDate.get(date));
      if (summaryText) {
        const content = document.createElement("div");
        content.className = "archive-content";
        content.textContent = summaryText;
        details.appendChild(content);
      }

      const newsItems = newsByDate.get(date);
      if (newsItems?.length) {
        details.appendChild(buildArchiveNewsList(newsItems));
      }

      list.appendChild(details);
    }

    if (past.length > shown.length) {
      const note = document.createElement("div");
      note.className = "error";
      note.style.marginTop = "8px";
      note.textContent = t("archiveMore")(past.length - shown.length);
      list.appendChild(note);
    }
  }

  function renderAll() {
    renderMarket(cache.market);
    renderNews(cache.news);
    renderSummary(cache.summary);
    renderHistory(cache.history);
    renderRealestate(cache.realestate);
    renderRealestateHistory(cache.realestateHistory);
    renderArchive(cache.summaryHistory, cache.newsHistory);

    const latestSources = [cache.market, cache.news, cache.summary].filter(Boolean);
    const latest = latestSources.map((v) => v.updatedAt).filter(Boolean).sort().pop();
    document.getElementById("updated").textContent = latest
      ? t("lastUpdated")(fmtUpdated(latest))
      : t("lastUpdatedUnknown");
  }

  function applyLocale(next) {
    locale = next;
    window.localStorage.setItem("lang", locale);
    document.documentElement.setAttribute("lang", locale);
    document.title = t("title");
    document.getElementById("page-title").textContent = t("title");
    document.getElementById("summary-heading").textContent = t("summaryHeading");
    document.getElementById("market-heading").textContent = t("marketHeading");
    document.getElementById("realestate-heading").textContent = t("realestateHeading");
    document.getElementById("news-heading").textContent = t("newsHeading");
    document.getElementById("archive-heading").textContent = t("archiveHeading");

    const notice = document.getElementById("content-notice");
    const noticeText = t("contentNotice");
    notice.hidden = !noticeText;
    notice.textContent = noticeText ?? "";

    renderAll();
  }

  document.getElementById("lang-toggle").addEventListener("click", () => {
    applyLocale(locale === "en" ? "ko" : "en");
  });

  async function main() {
    locale = getInitialLocale();

    const [market, news, summary, history, summaryHistory, newsHistory, realestate, realestateHistory] =
      await Promise.allSettled([
        loadJson("market"),
        loadJson("news"),
        loadJson("summary"),
        loadJson("market-history"),
        loadJson("summary-history"),
        loadJson("news-history"),
        loadJson("realestate"),
        loadJson("realestate-history"),
      ]);

    cache.market = market.status === "fulfilled" ? market.value : null;
    cache.news = news.status === "fulfilled" ? news.value : null;
    cache.summary = summary.status === "fulfilled" ? summary.value : null;
    cache.history = history.status === "fulfilled" ? history.value : null;
    cache.summaryHistory = summaryHistory.status === "fulfilled" ? summaryHistory.value : null;
    cache.newsHistory = newsHistory.status === "fulfilled" ? newsHistory.value : null;
    cache.realestate = realestate.status === "fulfilled" ? realestate.value : null;
    cache.realestateHistory = realestateHistory.status === "fulfilled" ? realestateHistory.value : null;

    applyLocale(locale);
  }

  main();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
